name: Release

# Every push to main ships a stable MyBot release. The version is
# 0.1.<run number>, so each release is newer than the last and installed apps
# update to it through the GitHub Release's updater manifests (latest*.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A push that lands while one is running waits; if
# several pile up, only the newest waiting run is kept.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # The Windows desktop jobs read this run's artifact list to wait for the
  # Linux CLI archive they embed (see release-desktop.yml).
  actions: read
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      ref: ${{ github.sha }}
    steps:
      - id: release_meta
        name: Resolve release version
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "name=MyBot v$version" >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=mybot... --filter=@mybot/web... --filter=@mybot/desktop... --filter=@mybot/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      # @mybot/desktop#build compiles the Linux browser secret helper on a
      # Linux host before packing, and that needs libsecret headers.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      # Runs mybot#build (which depends on @mybot/web#build) and
      # @mybot/desktop#build, so apps/server/dist holds the server bundle
      # plus the web client and apps/desktop/dist-electron the Electron main.
      - name: Build JS bundle
        run: vp run build:desktop

      # Two paths under apps/ so the artifact root is apps/; consumers download
      # into `apps` to restore both at their original locations.
      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # One job per platform and architecture (see release-desktop.yml), each on
  # hardware of its own architecture. Every platform in CLI_ARCHIVE_PLATFORM_KEYS
  # (packages/shared/src/cliRelease.ts) builds a CLI archive for the release;
  # macOS x64 has none. The Windows jobs also embed the same-arch Linux CLI
  # archive as the WSL runtime.
  desktop:
    name: Desktop ${{ matrix.label }}
    needs: [preflight, build_bundle]
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
            cli_archive: true
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
            cli_archive: false
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
            cli_archive: true
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
            cli_archive: true
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
            cli_archive: true
          - label: Windows arm64
            runner: windows-11-arm
            platform: win
            target: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            resource_key: win32-arm64
            cli_archive: true
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      cli_archive: ${{ matrix.cli_archive }}

  release:
    name: Publish GitHub Release
    needs: [preflight, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@mybot/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # `mybot update`, the install scripts, and the service, SSH, and WSL
      # runtime installers verify archives against this file, so it is written
      # from the exact bytes that get uploaded.
      - name: Write CLI archive checksums
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(mybot-*.tar.gz mybot-*.zip)
          if [[ ${#archives[@]} -ne 5 ]]; then
            echo "Expected 5 CLI archives, found ${#archives[@]}: ${archives[*]}" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # electron-updater reads one manifest per platform and picks the file
      # entry whose name carries the running arch, so the per-arch manifests
      # the build jobs wrote are merged back into that one file.
      - name: Merge macOS updater manifests
        run: |
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

      - name: Merge Windows updater manifests
        run: |
          shopt -s nullglob
          for x64_manifest in release-assets/*-win-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}-arm64.yml"
            merged_manifest="${x64_manifest%-win-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform win "$x64_manifest" "$arm64_manifest" "$merged_manifest"
              rm -f "$x64_manifest" "$arm64_manifest"
            else
              mv "$x64_manifest" "$merged_manifest"
            fi
          done

      # builder-debug.yml is electron-builder's config dump, not a feed.
      - name: Drop build debug files
        run: rm -f release-assets/builder-debug.yml

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}
